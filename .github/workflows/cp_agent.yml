name: CP Ticket Agent

on:
  schedule:
    # Corre a cada 5 minutos para verificar a janela temporal e executar tentativas
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      trip_origin:
        description: 'Estação de Origem (ex: Aveiro)'
        required: false
        type: string
      trip_destination:
        description: 'Estação de Destino (ex: Lisboa - Oriente)'
        required: false
        type: string
      trip_date:
        description: 'Data da Viagem (YYYY-MM-DD)'
        required: false
        type: string
      trip_time:
        description: 'Hora do Comboio Intercidades (HH:MM)'
        required: false
        type: string
      reset_status:
        description: 'Reiniciar estado para PENDING? (true/false)'
        required: false
        default: 'false'
        type: string

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências e Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Executar Agente Autónomo CP
        env:
          # Variables do Repositório (ou Inputs manuais se fornecidos)
          TRIP_ORIGIN: ${{ github.event.inputs.trip_origin || vars.TRIP_ORIGIN }}
          TRIP_DESTINATION: ${{ github.event.inputs.trip_destination || vars.TRIP_DESTINATION }}
          TRIP_DATE: ${{ github.event.inputs.trip_date || vars.TRIP_DATE }}
          TRIP_TIME: ${{ github.event.inputs.trip_time || vars.TRIP_TIME }}
          BOOKING_STATUS: ${{ vars.BOOKING_STATUS || 'PENDING' }}
          RESET_STATUS: ${{ github.event.inputs.reset_status || 'false' }}

          # Secrets Encriptados
          CP_PASS_CODE: ${{ secrets.CP_PASS_CODE }}
          PASSENGER_NAME: ${{ secrets.PASSENGER_NAME }}
          PASSENGER_ID_NUMBER: ${{ secrets.PASSENGER_ID_NUMBER }}
          PASSENGER_EMAIL: ${{ secrets.PASSENGER_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python main.py
